<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% extends 'base.html' %}

{% block content %}
<div class="container my-5">

    <h2 class="text-center mb-4 fw-bold">🛒 Your Cart</h2>

    {% if items %}
    <div class="card shadow-sm p-3">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Item</th>
                        <th class="text-center">Price</th>
                    </tr>
                </thead>
                <tbody>
                    {% for i in items %}
                    <tr class="table-hover">
                        <td class="fw-semibold">{{ i.name }}</td>
                        <td class="text-center text-success fw-bold">₹ {{ i.price }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <h4>Total: <span class="text-success fw-bold">₹ {{ total }}</span></h4>
            <a href="/checkout" class="btn btn-success btn-lg shadow-sm">
                ✅ Checkout
            </a>
        </div>
    </div>

    {% else %}
    <div class="text-center mt-5">
        <h4>Your cart is empty 😢</h4>
        <a href="/" class="btn btn-primary mt-3">Go to Home</a>
    </div>
    {% endif %}

</div>
{% endblock %}


</body>
</html>
