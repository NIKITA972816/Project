<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">

    <h2 class="mb-4 text-center fw-bold">🍽️ Admin Panel</h2>

    <!-- ADD FOOD CARD -->
    <div class="card shadow mb-5">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Add New Food Item</h5>
        </div>

        <div class="card-body">
            <form action="{{ url_for('add_food') }}" method="POST" class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Food Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Eg: Pizza" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Price (₹)</label>
                    <input type="number" name="price" class="form-control" placeholder="Eg: 199" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Image Name</label>
                    <input type="text" name="image" class="form-control" placeholder="pizza.jpg" required>
                </div>

                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-success px-4">
                        ➕ Add Food
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- FOOD LIST -->
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Food Items</h5>
        </div>

        <div class="card-body p-0">
            <table class="table table-hover table-bordered mb-0 text-center align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Image</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>
                {% for food in foods %}
                    <tr>
                        <td class="fw-semibold">{{ food.name }}</td>
                        <td>₹ {{ food.price }}</td>
                        <td>
                            <span class="badge bg-secondary">{{ food.image }}</span>
                        </td>
                        <td>
                            <a href="{{ url_for('delete_food', id=food.id) }}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete this item?')">
                               🗑 Delete
                            </a>
                        </td>
                    </tr>
                {% else %}
                    <tr>
                        <td colspan="4" class="text-muted py-4">
                            No food items added yet
                        </td>
                    </tr>
                {% endfor %}
                </tbody>

            </table>
        </div>
    </div>

</div>
{% endblock %}

</body>
</html>
