<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">

    <!-- PAYMENT CARD -->
    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%; border-radius: 18px;">

        <h3 class="text-center mb-4 fw-bold">💳 Payment</h3>

        <!-- TOTAL AMOUNT -->
        <p class="text-center fs-5">
            Total Amount: <strong class="text-success">₹ {{ total }}</strong>
        </p>

        <!-- BUTTONS -->
        <div class="d-grid gap-3 mt-4">

            <!-- PAY NOW -->
            <button class="btn btn-success btn-lg w-100"
                    onclick="alert('✅ Payment Successful!'); window.location.href='/'">
                💰 Pay Now
            </button>

            <!-- CONFIRM ORDER -->
            <form action="{{ url_for('place_order') }}" method="get">
                <button type="submit" class="btn btn-success btn-lg w-100">
                    ✅ Confirm Order
                </button>
            </form>

        </div>
    </div>
</div>
{% endblock %}


</body>
</html>
