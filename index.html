<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% extends 'base.html' %}

{% block content %}

<h2 class="text-center mb-4">Order Your Food 🍕</h2>

<div class="row">
    {% for food in foods %}
    <div class="col-md-4">
        <div class="card food-card mb-3">
            <img src="{{ url_for('static', filename='images/' + food.image) }}"
                 class="card-img-top"
                 alt="{{ food.name }}"
                 height="200">

            <div class="card-body text-center">
                <h5 class="card-title">{{ food.name }}</h5>
                <p class="card-text">₹ {{ food.price }}</p>

                {% if session.get('user') %}
                    <a href="/add/{{ food.id }}" class="btn btn-success">
                        Add to Cart
                    </a>
                {% else %}
                    <a href="/register" class="btn btn-secondary">
                        Register to Buy
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}

</body>
</html>
